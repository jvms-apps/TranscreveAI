name: Build Executável Windows (Release)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências (Build Universal CPU + PyInstaller)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Instala dependências excluindo pacotes NVIDIA gigantes (~1.2GB) para gerar ZIP universal
          Get-Content requirements.txt | Where-Object { $_ -notmatch "^nvidia-" } | Set-Content requirements-cpu.txt
          pip install -r requirements-cpu.txt pyinstaller

      - name: Compilar TranscreveAI.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --console --name TranscreveAI `
            --add-data "app/static;app/static" `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all sherpa_onnx `
            --collect-all sherpa_onnx_core `
            --collect-all imageio_ffmpeg `
            --collect-all onnxruntime `
            --collect-all soundfile `
            --collect-all docx `
            --collect-all reportlab `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import multipart `
            launcher.py

          Copy-Item README.md dist/TranscreveAI/README.md
          Compress-Archive -Path dist/TranscreveAI -DestinationPath TranscreveAI-Windows-Universal.zip -CompressionLevel Optimal

      - name: Enviar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: TranscreveAI-Windows-Universal
          path: TranscreveAI-Windows-Universal.zip

      - name: Publicar na Release do GitHub (em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TranscreveAI-Windows-Universal.zip
          generate_release_notes: true
